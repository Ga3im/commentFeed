<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="content" class="container">
      <ul id="commentList" class="comments"></ul>
      <div class="add-form">
        <input
          id="nameInput"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          id="commentInput"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button disabled class="add-form-button" id="addButton">
            Написать
          </button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const comments = [
      {
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        comment: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLike: false,
      },
      {
        name: "Варвара",
        date: "13.02.22 19:22",
        comment: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLike: true,
      },
    ];

    const contentEl = document.getElementById("content");
    const addButtonEl = document.getElementById("addButton");
    const nameInputEl = document.getElementById("nameInput");
    const commentInputEl = document.getElementById("commentInput");
    const commentListEl = document.getElementById("commentList");
    const likeButtonsEl = document.querySelectorAll(".like-button");
    const commentsEl = document.querySelectorAll(".comment");
    // функция времени
    const funcDate = () => {
      const currentDate = new Date();
      const options = {
        year: "numeric",
        month: "numeric",
        day: "numeric",
      };
      return currentDate.toLocaleDateString("ru-RU", options);
    };

    nameInputEl.addEventListener("input", () => {
      addButtonEl.disabled = false;
    });
    commentInputEl.addEventListener("input", () => {
      addButtonEl.disabled = false;
    });

    // Отрисовка комментариев через JS массив
    const renderComments = () => {
      const commentsHtml = comments
        .map((comment, index) => {
          return `<li class="comment">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.comment}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button data-index="${index}" class="like-button ${
            comment.isLike ? "-active-like" : ""
          }"></button>
            </div>
          </div>
        </li>`;
        })
        .join("");
      commentListEl.innerHTML = commentsHtml;
    };
    renderComments();

    // Событие при нажатии на лайк
    for (const likeButtonEl of likeButtonsEl) {
      likeButtonEl.addEventListener("click", (e) => {
        e.preventDefault();
        if (isLike) {
          --commentEl.likes;
        } else {
          ++commentEl.likes;
        }
        console.log(commentEl.likes);
      });
    }

    // Событие при нажатии на Enter
    contentEl.addEventListener("keyup", (e) => {
      e.preventDefault();
      if (e.keyCode === 13) {
        if (nameInputEl.value === "") {
          alert("Введите имя");
        } else {
          if (commentInputEl.value === "") {
            alert("Введите комментарий");
          } else {
            comments.push({
              name: nameInputEl.value,
              comment: commentInputEl.value,
              isLike: false,
              date: funcDate(),
              likes: 0,
            });
            nameInputEl.value = "";
            commentInputEl.value = "";
          }
        }
      }
      renderComments();
    });
    // Событие клика на кнопку "Написать"
    addButtonEl.addEventListener("click", (e) => {
      e.preventDefault();
      if (nameInputEl.value === "") {
        alert("Введите имя");
      } else {
        if (commentInputEl.value === "") {
          alert("Введите комментарий");
        } else {
          comments.push({
            name: nameInputEl.value,
            comment: commentInputEl.value,
            isLike: false,
            date: funcDate(),
            likes: 0,
          });
          nameInputEl.value = "";
          commentInputEl.value = "";
        }
      }
      renderComments();
    });
  </script>
</html>
