<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="content" class="container">
      <ul id="commentList" class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          id="nameInput"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          id="commentInput"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button disabled class="add-form-button" id="addButton">
            Написать
          </button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    console.log("It works!");
    const contentEl = document.getElementById("content");
    const addButtonEl = document.getElementById("addButton");
    const nameInputEl = document.getElementById("nameInput");
    const commentInputEl = document.getElementById("commentInput");
    const commentListEl = document.getElementById("commentList");

    const funcDate = () => {
      const currentDate = new Date();
      const options = {
        year: "numeric",
        month: "numeric",
        day: "numeric",
      };
      return currentDate.toLocaleDateString("ru-RU", options);
    };

    nameInputEl.addEventListener("input", () => {
      addButtonEl.disabled = false;
    });
    commentInputEl.addEventListener("input", () => {
      addButtonEl.disabled = false;
    });

    contentEl.addEventListener("keyup", (e) => {
      e.preventDefault();
      if (e.keyCode === 13) {
        if (nameInputEl.value === "") {
          alert("Введите имя");
        } else {
          if (commentInputEl.value === "") {
            alert("Введите комментарий");
          } else {
            commentListEl.innerHTML =
              commentListEl.innerHTML +
              `<li class="comment">
          <div class="comment-header">
            <div>${nameInputEl.value}</div>
            <div>${funcDate()}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${commentInputEl.value}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">0</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>`;
          }
        }
      }
    });

    addButtonEl.addEventListener("click", (e) => {
      e.preventDefault();
      if (nameInputEl.value === "") {
        alert("Введите имя");
      } else {
        if (commentInputEl.value === "") {
          alert("Введите комментарий");
        } else {
          commentListEl.innerHTML =
            commentListEl.innerHTML +
            `<li class="comment">
          <div class="comment-header">
            <div>${nameInputEl.value}</div>
            <div>${funcDate()}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${commentInputEl.value}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">0</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>`;
        }
      }
    });


  </script>
</html>
