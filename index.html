<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="content" class="container">
      <ul id="commentList" class="comments"></ul>
      <div id="loadish" class="load">Комментарии загружаются...</div>
      <div id="addForm" class="disable">
        <input
          id="nameInput"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          id="commentInput"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button disabled class="add-form-button" id="addButton">
            Написать
          </button>
        </div>
      </div>
    </div>
  </body>

  <script type="module" src="main.js"></script>
</html>
