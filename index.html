<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="content" class="container">
      <ul id="commentList" class="comments"></ul>
      <div class="add-form">
        <input
          id="nameInput"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          readonly
          class="quote defaultTextarea"
          name=""
          id=""
        ></textarea>
        <textarea
          id="commentInput"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button id="quote-cancel-button" class="quote-button">Отменить</button>
          <button disabled class="add-form-button" id="addButton">
            Написать
          </button>
        </div>
      </div>
    </div>
  </body>

  <script src="script.js"></script>
</html>
