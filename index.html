<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="content" class="container">
      <ul id="commentList" class="comments"></ul>
      <div class="add-form">
        <input
          id="nameInput"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          id="commentInput"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button disabled class="add-form-button" id="addButton">
            Написать
          </button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const comments = [
      {
        id: 1,
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        comment: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLike: false,
        idEdit: false,
      },
      {
        id: 2,
        name: "Варвара",
        date: "13.02.22 19:22",
        comment: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLike: true,
        idEdit: false,
      },
    ];

    const contentEl = document.getElementById("content");
    const addButtonEl = document.getElementById("addButton");
    const nameInputEl = document.getElementById("nameInput");
    const commentInputEl = document.getElementById("commentInput");
    const commentListEl = document.getElementById("commentList");
    let editComment = "";

    // функция времени
    const funcDate = () => {
      const currentDate = new Date();
      const options = {
        year: "numeric",
        month: "numeric",
        day: "numeric",
      };
      return currentDate.toLocaleDateString("ru-RU", options);
    };

    nameInputEl.addEventListener("input", () => {
      addButtonEl.disabled = false;
    });
    commentInputEl.addEventListener("input", () => {
      addButtonEl.disabled = false;
    });
    // редактирование комментария при двойном клике
    const initEditListener = () => {
      const commentsEl = document.querySelectorAll(".comment-body");
      const likeButtonsEl = document.querySelectorAll(".like-button");
      for (const commentEl of commentsEl) {
        let id = Number(commentEl.dataset.id);
        commentEl.addEventListener("dblclick", (e) => {
          e.preventDefault();
          comments.map((comment) => {
            if (comment.id === id) {
              editComment = comment.comment;
              comment.isEdit = true;
            }
          });
          renderComments();
        });
      }
    };

    // отмена редактирования
    const initCancelEditListener = () => {
      const cancelBtnsEls = document.querySelectorAll(".button-cancel");
      for (const cancelBtnEl of cancelBtnsEls) {
        let id = Number(cancelBtnEl.dataset.id);
        cancelBtnEl.addEventListener("click", (e) => {
          e.preventDefault();
          comments.map((comment) => {
            if (comment.id === id) {
              comment.comment = editComment;
              comment.isEdit = false;
            }
          });
          renderComments();
        });
      }
    };

    // Событие при нажатии на лайк
    const initLikeBtnListener = () => {
      const likeButtonsEl = document.querySelectorAll(".like-button");
      for (const likeButtonEl of likeButtonsEl) {
        let id = Number(likeButtonEl.dataset.id);
        likeButtonEl.addEventListener("click", (e) => {
          e.preventDefault();
          comments.map((comment) => {
            if (comment.id === id) {
              if (comment.isLike) {
                --comment.likes;
                comment.isLike = false;
              } else {
                ++comment.likes;
                comment.isLike = true;
              }
            }
          });
          renderComments();
        });
      }
    };
    // Отрисовка комментариев через JS массив
    const renderComments = () => {
      const commentsHtml = comments
        .map((comment) => {
          return `<li class="comment" >
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body" data-id="${comment.id}">
            ${
              comment.isEdit
                ? `<textarea value="${editComment}" class="comment-edit"></textarea>`
                : `<div class="comment-text">${comment.comment}</div>`
            }

          </div>
          <div class="comment-footer">
          ${
            comment.isEdit
              ? `<button class='button-save'>Сохранить</button> <button class='button-cancel' data-id="${comment.id}">Отмена</button>`
              : ""
          }
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button class="like-button ${
                comment.isLike ? "-active-like" : ""
              }" data-id="${comment.id}" ></button>
            </div>
          </div>
        </li>`;
        })
        .join("");

      commentListEl.innerHTML = commentsHtml;
      initLikeBtnListener();
      initEditListener();
      initCancelEditListener();
    };

    renderComments();

    // Событие при нажатии на Enter
    contentEl.addEventListener("keyup", (e) => {
      e.preventDefault();
      if (e.keyCode === 13) {
        if (nameInputEl.value === "") {
          alert("Введите имя");
        } else {
          if (commentInputEl.value === "") {
            alert("Введите комментарий");
          } else {
            comments.push({
              name: nameInputEl.value,
              comment: commentInputEl.value,
              isLike: false,
              date: funcDate(),
              likes: 0,
              idEdit: false,
            });
            nameInputEl.value = "";
            commentInputEl.value = "";
          }
        }
      }
      renderComments();
    });

    // Событие клика на кнопку "Написать"
    addButtonEl.addEventListener("click", (e) => {
      e.preventDefault();
      if (nameInputEl.value === "") {
        alert("Введите имя");
      } else {
        if (commentInputEl.value === "") {
          alert("Введите комментарий");
        } else {
          comments.push({
            id: comments.length + 1,
            name: nameInputEl.value,
            comment: commentInputEl.value,
            isLike: false,
            date: funcDate(),
            likes: 0,
          });
          nameInputEl.value = "";
          commentInputEl.value = "";
        }
      }
      renderComments();
    });
  </script>
</html>
